name: Build Cross-Platform Installers

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write
  
jobs:
  build:
    name: Build Installer on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: macos-latest
          - os: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2

            # FIX: Updated webkit package version from 4.0 to 4.1
      - name: Install Linux System Dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libsoup2.4-dev libwebkit2gtk-4.1-dev

      - name: Install Cargo Packager CLI
        run: cargo install cargo-packager --locked

            # 1. Compile the native binary artifacts
      - name: Build Release Binary
        run: cargo build --release

      # FIX: Force the packager to save installers into a specific "dist" folder
      - name: Package Application (Windows)
        if: matrix.os == 'windows-latest'
        run: cargo packager --release --packages file-reader --formats nsis --out-dir dist

      - name: Package Application (macOS)
        if: matrix.os == 'macos-latest'
        run: cargo packager --release --packages file-reader --formats dmg --out-dir dist

      - name: Package Application (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: cargo packager --release --packages file-reader --formats deb --out-dir dist

      # FIX: Point the upload artifact step to target that precise "dist" directory
      - name: Upload Installer Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.os }}
          path: dist/**/*
  publish:
    name: Create Public Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Release v${{ github.run_number }}
          draft: false
          prerelease: false
          files: |
            dist/installers-windows-latest/**/*
            dist/installers-macos-latest/**/*
            dist/installers-ubuntu-latest/**/*
